name: Build Conselheiro Sticker

on:
  push:
    paths:
      - "sticker/**"
      - ".github/workflows/sticker.yml"
      - "settings.gradle.kts"
      - "build.gradle.kts"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew --no-daemon :sticker:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: conselheiro-sticker-apk
          path: sticker/build/outputs/apk/debug/sticker-debug.apk

      # Na main, publica o APK numa release própria (sem tirar o "latest" do Consigliere).
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' sticker/build.gradle.kts)
          TAG="sticker-v${VERSION}-${GITHUB_RUN_NUMBER}"
          cp sticker/build/outputs/apk/debug/sticker-debug.apk "ConselheiroSticker-${VERSION}.apk"
          gh release create "$TAG" "ConselheiroSticker-${VERSION}.apk" --draft --latest=false \
            --title "Conselheiro Sticker ${VERSION}" \
            --notes "Build ${GITHUB_SHA::7}. Baixe o APK no celular e instale."
          gh release edit "$TAG" --draft=false --latest=false
