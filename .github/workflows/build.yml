name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Coleção de arte de reserva (Met Museum)
        run: python3 tools/fetch_art.py app/src/main/assets/art || true

      - name: Build
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: agenda-widget-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Pacote da Play Store (.aab), só quando a chave de upload está nos segredos.
      - name: Build Play Store bundle
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then echo "Sem chave de upload; pulando o .aab"; exit 0; fi
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          UPLOAD_KEYSTORE_PATH="$RUNNER_TEMP/upload.keystore" ./gradlew --no-daemon bundleRelease
          rm -f "$RUNNER_TEMP/upload.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: consigliere-play-store-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Cria a release como rascunho, sobe o APK e só então publica:
          # quem baixar nunca pega um arquivo pela metade.
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TAG="v${VERSION}-${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/debug/app-debug.apk "Consigliere-${VERSION}.apk"
          gh release create "$TAG" "Consigliere-${VERSION}.apk" --draft \
            --title "Consigliere ${VERSION}" \
            --notes "Build ${GITHUB_SHA::7}. Baixe o APK no celular e instale por cima."
          gh release edit "$TAG" --draft=false --latest
          # Remove a release antiga "latest" do esquema anterior, se ainda existir.
          gh release delete latest --yes --cleanup-tag || true
