name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: agenda-widget-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk agenda-widget.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest agenda-widget.apk \
            --title "Última versão" \
            --notes "Build de ${GITHUB_SHA::7}. Baixe agenda-widget.apk no celular e instale." \
            --prerelease
