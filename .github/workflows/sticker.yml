name: Build Unusual Stickers

on:
  push:
    paths:
      - "sticker/**"
      - ".github/workflows/sticker.yml"
      - "settings.gradle.kts"
      - "build.gradle.kts"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew --no-daemon :sticker:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: unusual-stickers-apk
          path: sticker/build/outputs/apk/debug/sticker-debug.apk

      # Pacote da Play Store (.aab), assinado com a chave de upload dos segredos (a mesma do Consigliere).
      - name: Build Play Store bundle
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then echo "Sem chave de upload; pulando o .aab"; exit 0; fi
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          UPLOAD_KEYSTORE_PATH="$RUNNER_TEMP/upload.keystore" ./gradlew --no-daemon :sticker:bundleRelease
          rm -f "$RUNNER_TEMP/upload.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: unusual-stickers-play-store-aab
          path: sticker/build/outputs/bundle/release/sticker-release.aab
          if-no-files-found: ignore

      # Na main, publica o APK numa release própria (sem tirar o "latest" do Consigliere).
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' sticker/build.gradle.kts)
          TAG="sticker-v${VERSION}-${GITHUB_RUN_NUMBER}"
          cp sticker/build/outputs/apk/debug/sticker-debug.apk "UnusualStickers-${VERSION}.apk"
          gh release create "$TAG" "UnusualStickers-${VERSION}.apk" --draft --latest=false \
            --title "Unusual Stickers ${VERSION}" \
            --notes "Build ${GITHUB_SHA::7}. Baixe o APK no celular e instale."
          gh release edit "$TAG" --draft=false --latest=false
