name: Check

# Compila e testa as branches de trabalho e os PRs, sem publicar nada:
# erro aparece aqui, antes de chegar na main e virar APK.
on:
  push:
    branches-ignore: [main]
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "sticker/**"
      - ".github/workflows/sticker.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Compilar
        run: ./gradlew --no-daemon :app:assembleDebug
